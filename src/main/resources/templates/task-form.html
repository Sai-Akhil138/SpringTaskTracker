<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${task.id != null ? 'Edit Task' : 'New Task'}">Task Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h1 class="h3 mb-4" th:text="${task.id != null ? 'Edit Task' : 'New Task'}"></h1>

<form th:action="@{/tasks}" th:object="${task}" method="post" class="card p-4 shadow-sm">
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" th:field="*{title}" class="form-control" placeholder="Enter task title" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Enter task description"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select th:field="*{status}" class="form-select">
            <option th:value="NOT_STARTED">Not Started</option>
            <option th:value="IN_PROGRESS">In Progress</option>
            <option th:value="DONE">Done</option>
        </select>
    </div>

    <div class="d-flex justify-content-between">
        <a href="/tasks" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-success">Save</button>
    </div>
</form>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
